# DRAFT: expanded end-to-end stages have not passed as a suite on iOS26.5.
# Fresh per-ID results live outside the repository; never infer PASS from these templates.
# Duplicate label/input indexes proved unreliable; use inspected input bounds for live QA.
# Maestro deduplicates nested label Text nodes; target input index 1 and tap its right edge.
# Requires an approved disposable fixture and runtime QA_ENDPOINT, QA_TOKEN, QA_RUN_ID.
# Run auth-navigation.yaml with runtime credentials first; never clear app data between stages.
# QA_WRITE_STAGE: general (default), core, buy, sell, books, prepare, retry, response-loss, response-retry, cleanup, template.
# QA_CASE defaults to offline. Use a new QA_CASE for the response-loss preparation.
# Stage barriers let the runner audit the ledger and arm an exact visible request key.
# UI screenshots alone do not prove transaction counts, same-key reuse, or no duplicates.
# No physical network outage is simulated: prepare uses the explicit no-send product action.
# W01.2 automatic stock realized gain is product unsupported (N/A), never PASS.
# W01.8: template stage creates/deletes pending requests; cleanup deletes completed ones.
- assertTrue: ${typeof QA_ENDPOINT !== 'undefined' && typeof QA_TOKEN !== 'undefined' && typeof QA_RUN_ID !== 'undefined'}
- evalScript: "${output.stage = typeof QA_WRITE_STAGE === 'undefined' ? 'general' : QA_WRITE_STAGE}"
- evalScript: "${output.caseName = typeof QA_CASE === 'undefined' ? 'offline' : QA_CASE}"
- assertTrue: ${['core','general','buy','sell','books','prepare','retry','response-loss','response-retry','cleanup','template'].indexOf(output.stage) >= 0}
# Every independent write stage verifies the native active connection, not only API preflight.
- assertTrue: ${typeof QA_LEDGER_ID !== 'undefined'}
- repeat:
    times: 12
    commands:
      - swipe:
          direction: DOWN
