name: Mobile production builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/mobile-release*'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.github/workflows/mobile-release.yml'
      - '.github/mobile-release/**'

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Test release automation
        run: node --test scripts/mobile-release.test.mjs
      - name: Install Yarn
        run: |
          npm install --global corepack@0.34.0
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          test "$(yarn --version)" = '4.12.0'
      - name: Build unsigned production APK
        shell: bash
        run: |
          set -o pipefail
          node scripts/mobile-release.mjs --platform android --work-dir "$RUNNER_TEMP/mobile-work" --output-dir "$RUNNER_TEMP/mobile-output" 2>&1 | tee "$RUNNER_TEMP/mobile-ci.log"
      - name: Upload Android build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mobile-output/
            ${{ runner.temp }}/mobile-ci.log
          if-no-files-found: warn
          retention-days: 7

  ios:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler: '2.6.9'
      - name: Install locked CocoaPods
        shell: bash
        run: |
          export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/.github/mobile-release/Gemfile"
          export BUNDLE_PATH="$RUNNER_TEMP/mobile-gems"
          export BUNDLE_FROZEN=true
          bundle install
          test "$(bundle exec pod --version)" = '1.17.0'
          {
            echo "BUNDLE_GEMFILE=$BUNDLE_GEMFILE"
            echo "BUNDLE_PATH=$BUNDLE_PATH"
            echo 'BUNDLE_FROZEN=true'
          } >> "$GITHUB_ENV"
      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.0'
      - name: Test release automation
        run: node --test scripts/mobile-release.test.mjs
      - name: Install Yarn
        run: |
          npm install --global corepack@0.34.0
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          test "$(yarn --version)" = '4.12.0'
      - name: Build unsigned production simulator app
        shell: bash
        run: |
          set -o pipefail
          bundle exec node scripts/mobile-release.mjs --platform ios --ios-target simulator --work-dir "$RUNNER_TEMP/mobile-work" --output-dir "$RUNNER_TEMP/mobile-output" 2>&1 | tee "$RUNNER_TEMP/mobile-ci.log"
      - name: Archive simulator app preserving permissions and symlinks
        shell: bash
        run: |
          cd "$RUNNER_TEMP/mobile-output"
          shopt -s nullglob
          apps=(*.app)
          test "${#apps[@]}" -eq 1
          tar -czf ios-simulator.app.tar.gz "${apps[0]}"
      - name: Upload iOS build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mobile-output/*.tar.gz
            ${{ runner.temp }}/mobile-output/manifest.json
            ${{ runner.temp }}/mobile-ci.log
          if-no-files-found: warn
          retention-days: 7
